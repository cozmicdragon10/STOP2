services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stop2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stop2}
      POSTGRES_DB: ${POSTGRES_DB:-stop2}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
